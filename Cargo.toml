[package]
name = "xiaomi-touch"
version = "1.0.0"
edition = "2021"
description = "CLI tool to control /dev/xiaomi-touch via ioctl (supports both standard and Marble protocol)"
authors = ["xiaomi-touch-rs"]

[[bin]]
name = "xiaomi-touch"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
